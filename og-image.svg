<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="rgba(108,92,231,0.10)"/>
      <stop offset="50%" stop-color="rgba(108,92,231,0.04)"/>
      <stop offset="100%" stop-color="rgba(108,92,231,0)"/>
    </radialGradient>
    <radialGradient id="glowSmall" cx="50%" cy="35%" r="28%">
      <stop offset="0%" stop-color="rgba(162,155,254,0.07)"/>
      <stop offset="100%" stop-color="rgba(162,155,254,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle radial glows -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="500" fill="url(#glowSmall)"/>

  <!-- Thin decorative line at top -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#purpleGrad)" opacity="0.25"/>

  <!-- Logo box: WH monogram -->
  <rect x="550" y="95" width="100" height="100" rx="22" ry="22" fill="url(#logoBg)" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <text x="600" y="147" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="url(#purpleGrad)">WH</text>

  <!-- Title: wooogy-hq -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">wooogy</tspan><tspan fill="url(#purpleGrad)">-hq</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="url(#purpleGrad)">AI 시대, 개인의 힘을 증명한다</text>

  <!-- Divider -->
  <line x1="540" y1="395" x2="660" y2="395" stroke="rgba(108,92,231,0.15)" stroke-width="1"/>

  <!-- Footer subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#555">Built by a human and an AI.</text>

  <!-- Bottom URL -->
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#444">wooogy-hq.com</text>

  <!-- Thin decorative line at bottom -->
  <rect x="0" y="629" width="1200" height="1" fill="url(#purpleGrad)" opacity="0.15"/>

</svg>